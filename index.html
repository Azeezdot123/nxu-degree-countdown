<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Education SLO Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
  margin: 0;
  font-family: system-ui, sans-serif;
  background: radial-gradient(circle at top, #0b1320, #05070d);
  color: #e6edf3;
  display: flex;
  justify-content: center;
  padding: 2rem;
}

.dashboard {
  width: 100%;
  max-width: 1100px;
  display: grid;
  gap: 1.5rem;
}

/* HEADER */
.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 1.2rem;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 14px;
}

.title {
  font-size: 1.3rem;
  font-weight: 700;
}

.sub {
  font-size: 0.8rem;
  opacity: 0.7;
}

/* GRID */
.grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1rem;
}

.card {
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 14px;
  padding: 1rem;
}

/* UPTIME RING */
.ring {
  width: 120px;
  height: 120px;
  border-radius: 50%;
  background: conic-gradient(#00ffcc var(--p), rgba(255,255,255,0.08) 0);
  display: flex;
  align-items: center;
  justify-content: center;
  margin: auto;
}

.ring-inner {
  width: 90px;
  height: 90px;
  border-radius: 50%;
  background: #0b1320;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
}

/* METRICS */
.metric {
  text-align: center;
}

.metric h2 {
  margin: 0;
}

.small {
  font-size: 0.75rem;
  opacity: 0.7;
}

/* TIMELINE */
.timeline {
  height: 10px;
  background: rgba(255,255,255,0.08);
  border-radius: 999px;
  position: relative;
}

.timeline-fill {
  height: 100%;
  background: linear-gradient(90deg,#00ffcc,#7c5cff);
  border-radius: 999px;
}

/* ALERTS */
.alert {
  padding: 0.6rem;
  border-left: 3px solid #00ffcc;
  background: rgba(0,255,204,0.05);
  margin-top: 0.5rem;
  font-size: 0.8rem;
}

/* CHART */
canvas {
  width: 100% !important;
  height: 220px !important;
}
</style>
</head>

<body>

<div class="dashboard">

  <!-- HEADER -->
  <div class="header">
    <div>
      <div class="title">🎓 Education Reliability Dashboard</div>
      <div class="sub">NXU Degree Observability System</div>
    </div>
    <div class="sub" id="dateNow"></div>
  </div>

  <!-- METRICS -->
  <div class="grid">

    <!-- UPTIME -->
    <div class="card metric">
      <div class="ring" id="ring">
        <div class="ring-inner">
          <h2 id="uptime">0%</h2>
          <div class="small">Completion</div>
        </div>
      </div>
    </div>

    <!-- DAYS -->
    <div class="card metric">
      <h2 id="daysElapsed">0</h2>
      <div class="small">Days Completed</div>
      <hr style="opacity:0.1">
      <h2 id="daysLeft">0</h2>
      <div class="small">Days Remaining (Error Budget)</div>
    </div>

    <!-- COURSE -->
    <div class="card metric">
      <h2>40</h2>
      <div class="small">Total Courses</div>
      <hr style="opacity:0.1">
      <h2 id="courseDone">33</h2>
      <div class="small">Completed Courses</div>
    </div>

  </div>

  <!-- TIMELINE -->
  <div class="card">
    <h3>📍 Lifecycle Timeline</h3>
    <div class="timeline">
      <div class="timeline-fill" id="timelineFill"></div>
    </div>
  </div>

  <!-- CHART -->
  <div class="card">
    <h3>📈 Progress Trajectory (SLO Trend)</h3>
    <canvas id="chart"></canvas>
  </div>

  <!-- ALERTS -->
  <div class="card">
    <h3>🚨 Active SLO Signals</h3>
    <div id="alerts"></div>
  </div>

</div>

<script>
const start = new Date("2023-04-01");
const end = new Date("2026-10-31");
const now = new Date();

const totalDays = Math.ceil((end - start) / (1000*60*60*24));
const elapsedDays = Math.ceil((now - start) / (1000*60*60*24));
const remainingDays = totalDays - elapsedDays;

const uptime = Math.min(100, (elapsedDays / totalDays) * 100).toFixed(2);

// HEADER DATE
document.getElementById("dateNow").innerText = now.toDateString();

// METRICS
document.getElementById("uptime").innerText = uptime + "%";
document.getElementById("daysElapsed").innerText = elapsedDays;
document.getElementById("daysLeft").innerText = remainingDays;

// RING
document.getElementById("ring").style.setProperty("--p", uptime + "%");

// TIMELINE
const progress = (elapsedDays / totalDays) * 100;
document.getElementById("timelineFill").style.width = progress + "%";

// ALERT LOGIC (SRE STYLE)
const alerts = document.getElementById("alerts");

if (uptime > 50) {
  alerts.innerHTML += `<div class="alert">✔ System stable: past halfway milestone reached</div>`;
}
if (uptime > 75) {
  alerts.innerHTML += `<div class="alert">⚠ High progress: final phase approaching</div>`;
}
if (uptime > 90) {
  alerts.innerHTML += `<div class="alert">🚨 Critical phase: near completion window</div>`;
}

// CHART (simulated SLO trend)
const ctx = document.getElementById('chart');

const labels = [];
const data = [];

for (let i = 0; i <= 12; i++) {
  labels.push(`M${i}`);
  data.push((i/12) * 100);
}

new Chart(ctx, {
  type: 'line',
  data: {
    labels,
    datasets: [{
      label: 'Completion SLO %',
      data,
      borderColor: '#00ffcc',
      tension: 0.4,
      fill: true
    }]
  },
  options: {
    plugins: {
      legend: { display: false }
    },
    scales: {
      x: { display: true },
      y: { display: true, max: 100 }
    }
  }
});
</script>

</body>
</html>
