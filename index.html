<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Education Observability Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
  margin: 0;
  font-family: system-ui, sans-serif;
  background: radial-gradient(circle at top, #0b1320, #05070d);
  color: #e6edf3;
  padding: 2rem;
}

.container {
  max-width: 1200px;
  margin: auto;
  display: grid;
  gap: 1.5rem;
}

.header {
  display: flex;
  justify-content: space-between;
  padding: 1.2rem;
  border-radius: 14px;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.08);
}

.title {
  font-size: 1.4rem;
  font-weight: 700;
}

.sub {
  font-size: 0.8rem;
  opacity: 0.7;
}

.grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 1rem;
}

.card {
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 14px;
  padding: 1rem;
}

/* KPI */
.kpi {
  font-size: 1.8rem;
  font-weight: 800;
}

/* CHART */
canvas {
  width: 100% !important;
  height: 260px !important;
}

/* BADGES */
.badge {
  display: inline-block;
  padding: 0.3rem 0.6rem;
  border-radius: 999px;
  font-size: 0.7rem;
  margin-top: 0.3rem;
}

.green { background: rgba(0,255,204,0.15); color: #00ffcc; }
.red { background: rgba(255,77,77,0.15); color: #ff4d4d; }
.yellow { background: rgba(255,200,0,0.15); color: #ffd166; }

.table {
  width: 100%;
  font-size: 0.8rem;
  border-collapse: collapse;
}

.table td {
  padding: 0.4rem;
  border-bottom: 1px solid rgba(255,255,255,0.05);
}

.section-title {
  font-weight: 700;
  margin-bottom: 0.5rem;
}
</style>
</head>

<body>

<div class="container">

<!-- HEADER -->
<div class="header">
  <div>
    <div class="title">🎓 Education Observability System</div>
    <div class="sub">SRE-style academic telemetry dashboard</div>
  </div>
  <div class="sub" id="today"></div>
</div>

<!-- KPIs -->
<div class="grid">

  <div class="card">
    <div class="kpi" id="availability">0%</div>
    <div class="sub">System Availability</div>
    <div class="badge green">Healthy</div>
  </div>

  <div class="card">
    <div class="kpi" id="passed">0</div>
    <div class="sub">Courses Passed</div>
  </div>

  <div class="card">
    <div class="kpi" id="failed">0</div>
    <div class="sub">Failures</div>
  </div>

  <div class="card">
    <div class="kpi" id="withdrawn">0</div>
    <div class="sub">Withdrawals</div>
  </div>

</div>

<!-- CHARTS -->
<div class="card">
  <div class="section-title">📊 Course Outcome Distribution</div>
  <canvas id="pie"></canvas>
</div>

<div class="card">
  <div class="section-title">📈 Learning Velocity (Simulated Trend)</div>
  <canvas id="line"></canvas>
</div>

<!-- INCIDENT LOG -->
<div class="card">
  <div class="section-title">🚨 Incident Log (Failures / Withdrawals)</div>
  <table class="table" id="incidentTable"></table>
</div>

</div>

<script>

// ---------------- DATA ----------------
const courses = [
  { code:"ENT2100", status:"A" },
  { code:"FIN3150", status:"A" },
  { code:"ACC3250", status:"A" },
  { code:"MKT2200", status:"A" },
  { code:"HRM4250", status:"A" },
  { code:"HRM3150", status:"A" },
  { code:"COM1200", status:"A" },
  { code:"HRM2200", status:"A" },
  { code:"COM1200", status:"F" },
  { code:"CUL2300", status:"A" },
  { code:"DTF2100", status:"A" },
  { code:"FIN2100", status:"A" },
  { code:"SCI1150", status:"A" },
  { code:"SCI2150", status:"A" },
  { code:"SCI2150", status:"W" },
  { code:"NWL2100", status:"A" },
  { code:"PBS2250", status:"A" },
  { code:"ACC2200", status:"A" },
  { code:"ECO1250", status:"A" },
  { code:"MKT2150", status:"A" },
  { code:"ACC2100", status:"A" },
  { code:"STA1300", status:"A" },
  { code:"CUL2200", status:"A" },
  { code:"MKT2100", status:"A" },
  { code:"BUS2200", status:"A" },
  { code:"BUS2150", status:"A" },
  { code:"HRM2100", status:"A" },
  { code:"BUS2100", status:"A" },
  { code:"BUS2151", status:"A" },
  { code:"BUS2250", status:"A" },
  { code:"BUS2125", status:"A" },
  { code:"CUL1100", status:"A" },
  { code:"BUS1100", status:"A" }
];

// ---------------- CALCULATIONS ----------------
const total = courses.length;
const passed = courses.filter(c => c.status === "A").length;
const failed = courses.filter(c => c.status === "F").length;
const withdrawn = courses.filter(c => c.status === "W").length;

const availability = (passed / total) * 100;

// ---------------- HEADER ----------------
document.getElementById("today").innerText = new Date().toDateString();

// ---------------- KPI ----------------
document.getElementById("availability").innerText = availability.toFixed(1) + "%";
document.getElementById("passed").innerText = passed;
document.getElementById("failed").innerText = failed;
document.getElementById("withdrawn").innerText = withdrawn;

// ---------------- PIE CHART ----------------
new Chart(document.getElementById("pie"), {
  type: "pie",
  data: {
    labels: ["Passed", "Failed", "Withdrawn"],
    datasets: [{
      data: [passed, failed, withdrawn],
      backgroundColor: ["#00ffcc", "#ff4d4d", "#ffd166"]
    }]
  }
});

// ---------------- LINE CHART ----------------
const labels = [];
const trend = [];

for (let i = 0; i < total; i++) {
  labels.push("C" + (i+1));
  trend.push(((i+1)/total) * availability);
}

new Chart(document.getElementById("line"), {
  type: "line",
  data: {
    labels,
    datasets: [{
      label: "Learning Progress",
      data: trend,
      borderColor: "#00ffcc",
      tension: 0.4
    }]
  }
});

// ---------------- INCIDENT TABLE ----------------
const table = document.getElementById("incidentTable");

table.innerHTML = "<tr><td><b>Course</b></td><td><b>Status</b></td></tr>";

courses.forEach(c => {
  if (c.status !== "A") {
    const row = document.createElement("tr");

    let label =
      c.status === "F" ? "❌ Failed" :
      c.status === "W" ? "⚠ Withdrawn" : c.status;

    row.innerHTML = `<td>${c.code}</td><td>${label}</td>`;
    table.appendChild(row);
  }
});

</script>

</body>
</html>
