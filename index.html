<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Academic Observability Platform v2</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
  margin: 0;
  font-family: system-ui, sans-serif;
  background: radial-gradient(circle at top, #0b1320, #05070d);
  color: #e6edf3;
  padding: 2rem;
}

.container {
  max-width: 1200px;
  margin: auto;
  display: grid;
  gap: 1.5rem;
}

/* HEADER */
.header {
  display: flex;
  justify-content: space-between;
  padding: 1.2rem;
  background: rgba(255,255,255,0.04);
  border-radius: 14px;
  border: 1px solid rgba(255,255,255,0.08);
}

.title {
  font-size: 1.4rem;
  font-weight: 800;
}

.sub {
  font-size: 0.8rem;
  opacity: 0.7;
}

/* GRID */
.grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 1rem;
}

.card {
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 14px;
  padding: 1rem;
}

.kpi {
  font-size: 1.8rem;
  font-weight: 800;
}

/* PROGRESS BAR */
.progress {
  height: 12px;
  background: rgba(255,255,255,0.08);
  border-radius: 999px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  background: linear-gradient(90deg,#00ffcc,#7c5cff);
}

/* CHART */
canvas {
  width: 100% !important;
  height: 250px !important;
}

/* BADGE */
.badge {
  padding: 0.3rem 0.6rem;
  border-radius: 999px;
  font-size: 0.75rem;
  display: inline-block;
  margin-top: 0.3rem;
}

.green { background: rgba(0,255,204,0.15); color: #00ffcc; }
.red { background: rgba(255,77,77,0.15); color: #ff4d4d; }
.yellow { background: rgba(255,200,0,0.15); color: #ffd166; }

</style>
</head>

<body>

<div class="container">

<!-- HEADER -->
<div class="header">
  <div>
    <div class="title">🎓 Academic Observability System</div>
    <div class="sub">SRE-style learning lifecycle tracking</div>
  </div>
  <div class="sub" id="today"></div>
</div>

<!-- KPI GRID -->
<div class="grid">

  <div class="card">
    <div class="kpi" id="daysInSchool">0</div>
    <div class="sub">Days in School</div>
  </div>

  <div class="card">
    <div class="kpi" id="daysRemaining">0</div>
    <div class="sub">Days Remaining</div>
  </div>

  <div class="card">
    <div class="kpi" id="availability">0%</div>
    <div class="sub">Academic Reliability</div>
    <div id="statusBadge"></div>
  </div>

  <div class="card">
    <div class="kpi" id="downtime">0</div>
    <div class="sub">Break Days (Estimated)</div>
  </div>

</div>

<!-- PROGRESS -->
<div class="card">
  <div class="sub">📊 Journey Progress</div>
  <div class="progress">
    <div class="progress-fill" id="progressFill"></div>
  </div>
</div>

<!-- CHARTS -->
<div class="card">
  <div class="sub">📈 Course Outcome Distribution</div>
  <canvas id="pie"></canvas>
</div>

<div class="card">
  <div class="sub">📉 Learning Trajectory</div>
  <canvas id="line"></canvas>
</div>

</div>

<script>

// ---------------- CONFIG ----------------
const start = new Date("2023-04-01");
const end = new Date("2026-10-31");
const now = new Date();

// estimated break days (2 months twice)
const downtimeDays = 120;

// ---------------- COURSE DATA ----------------
const courses = [
"A","A","A","A","A","A","A","A","F","A","A","A","A","A","W",
"A","A","A","A","A","A","A","A","A","A","A","A","A","A","A","A","A","A"
];

// ---------------- CALC ----------------
const totalDays = Math.ceil((end - start)/(1000*60*60*24));
const daysInSchool = Math.ceil((now - start)/(1000*60*60*24));
const daysRemaining = totalDays - daysInSchool;

const passed = courses.filter(c => c === "A").length;
const failed = courses.filter(c => c === "F").length;
const withdrawn = courses.filter(c => c === "W").length;

const reliability = (passed / courses.length) * 100;

// ---------------- UI ----------------
document.getElementById("today").innerText = now.toDateString();

document.getElementById("daysInSchool").innerText = daysInSchool;
document.getElementById("daysRemaining").innerText = daysRemaining;
document.getElementById("availability").innerText = reliability.toFixed(1) + "%";
document.getElementById("downtime").innerText = downtimeDays;

// status
const badge = document.getElementById("statusBadge");
badge.innerHTML =
  reliability >= 95
    ? `<span class="badge green">HEALTHY</span>`
    : reliability >= 90
    ? `<span class="badge yellow">STABLE</span>`
    : `<span class="badge red">DEGRADED</span>`;

// progress
const progress = (daysInSchool / totalDays) * 100;
document.getElementById("progressFill").style.width = progress + "%";

// ---------------- PIE CHART ----------------
new Chart(document.getElementById("pie"), {
  type: "pie",
  data: {
    labels: ["Passed", "Failed", "Withdrawn"],
    datasets: [{
      data: [passed, failed, withdrawn],
      backgroundColor: ["#00ffcc","#ff4d4d","#ffd166"]
    }]
  }
});

// ---------------- LINE CHART ----------------
const labels = [];
const trend = [];

for (let i = 0; i < courses.length; i++) {
  labels.push("C" + (i+1));
  trend.push(((i+1)/courses.length) * reliability);
}

new Chart(document.getElementById("line"), {
  type: "line",
  data: {
    labels,
    datasets: [{
      label: "Learning Progress",
      data: trend,
      borderColor: "#00ffcc",
      tension: 0.4
    }]
  }
});

</script>

</body>
</html>
